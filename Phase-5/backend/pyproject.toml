[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Todo Web Application"
readme = "README.md"
authors = [
    { name = "MSohaibShahzad", email = "sohaibshahzad30@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.17",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.30.0",
    # Conversational AI dependencies
    "openai>=1.0.0",
    "openai-agents>=0.2.0",
    "openai-chatkit>=1.0.0",
    "mcp>=1.0.0",
    "redis>=5.0.0",
    "slowapi>=0.1.8",
    "apscheduler>=3.10.0",
    # Testing dependencies
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]
