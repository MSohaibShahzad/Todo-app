# Default values for todo-app Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  # Default image pull policy
  imagePullPolicy: IfNotPresent

# PostgreSQL Database Configuration
database:
  enabled: true  # Enabled - using local PostgreSQL in Kubernetes
  name: todo-db
  replicaCount: 1

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP  # Internal only - not exposed outside cluster
    port: 5432
    targetPort: 5432

  # Database credentials (use Secrets in production)
  auth:
    username: todouser
    password: "CHANGE-ME-database-password"
    database: todoapp

  # Persistent storage
  persistence:
    enabled: true
    storageClass: ""  # Use default storage class
    accessMode: ReadWriteOnce
    size: 5Gi

  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  # Health checks
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

# Backend (FastAPI) Configuration
backend:
  enabled: true
  name: todo-backend
  replicaCount: 1

  image:
    repository: todo-backend
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 8000
    targetPort: 8000

  # Environment variables
  env:
    JWT_ALGORITHM: HS256
    JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    ENVIRONMENT: production
    AI_MODEL: gpt-4-turbo
    RATE_LIMIT_REQUESTS_PER_MINUTE: "10"
    CONVERSATION_RETENTION_DAYS: "30"
    MAX_ACTIVE_CONVERSATIONS_PER_USER: "3"

  # Secrets (should be created separately or use external secret management)
  secrets:
    JWT_SECRET: "CHANGE-ME-generate-with-openssl-rand-base64-32"
    OPENAI_API_KEY: "CHANGE-ME-your-openai-api-key"
    REDIS_URL: "redis://localhost:6379"

  # Resource limits
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  # Health checks
  livenessProbe:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8000
    initialDelaySeconds: 40
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /api/v1/health
      port: 8000
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Autoscaling
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

# Frontend (Next.js) Configuration
frontend:
  enabled: true
  name: todo-frontend
  replicaCount: 1

  image:
    repository: todo-frontend
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 3000
    targetPort: 3000

  # Environment variables
  env:
    NODE_ENV: production
    NEXT_PUBLIC_CHATKIT_DOMAIN_KEY: "local-dev"
    # Use relative URLs for API calls - they will go through Next.js proxy
    # The proxy uses NEXT_PUBLIC_BACKEND_URL (set in configmap.yaml) to route to backend service
    # Empty string means endpoints like /api/v1/tasks are used as-is
    NEXT_PUBLIC_API_URL: ""
    # Better Auth needs NEXT_PUBLIC_APP_URL to know where auth endpoints are
    NEXT_PUBLIC_APP_URL: "http://172.19.169.234:4000"
    # Better Auth URL for server-side (keep for compatibility)
    BETTER_AUTH_URL: "http://172.19.169.234:4000"

  # Secrets (should be created separately)
  secrets:
    BETTER_AUTH_SECRET: "CHANGE-ME-generate-with-openssl-rand-base64-32"
    # Database URL for Better Auth - provide your database connection string
    DATABASE_URL: "CHANGE-ME-your-database-connection-string"

  # Resource limits
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  # Health checks (Next.js doesn't have a default health endpoint, so we check the root)
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Autoscaling
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

  # Frontend ingress
  frontend:
    host: todo-app.local
    path: /
    pathType: Prefix

  # Backend ingress
  backend:
    host: todo-app.local
    path: /api
    pathType: Prefix

  tls: []
  # - secretName: todo-app-tls
  #   hosts:
  #     - todo-app.local

# Service Account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod annotations and labels
podAnnotations: {}
podLabels: {}

# Security context
podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
