{{- if .Values.database.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.database.fullname" . }}-secret
  labels:
    {{- include "todo-app.database.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.database.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.auth.password | quote }}
  POSTGRES_DB: {{ .Values.database.auth.database | quote }}
{{- end }}

{{- if .Values.backend.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.backend.fullname" . }}-secret
  labels:
    {{- include "todo-app.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.backend.secrets.JWT_SECRET | quote }}
  OPENAI_API_KEY: {{ .Values.backend.secrets.OPENAI_API_KEY | quote }}
  REDIS_URL: {{ .Values.backend.secrets.REDIS_URL | quote }}
{{- end }}

{{- if .Values.frontend.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.frontend.fullname" . }}-secret
  labels:
    {{- include "todo-app.frontend.labels" . | nindent 4 }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ .Values.frontend.secrets.BETTER_AUTH_SECRET | quote }}
{{- end }}
